<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Task 1.3</title>
    </head>
    <body>
        <!--username and email-->
        <form action="https://httpbin.org/dump/request" method="POST">
            <p>
                <label for="uname">Enter your username:</label>
                <input type="text" id="uname" name="username">
                <label for="em">Enter your email:</label>
                <input type="email" id="em" name="email">
            </p>
        <!--birthday-->
            <p>
                <label for="dob">Enter your birthday:</label>
                <input type="date" id="dob" name="DoB">
            </p>
        <!--colour picker-->
            <p>
                <label for="col">Pick a colour:</label>
                <input type="color" name="favcolor" id="col">
            </p>
        <!--staff or student-->
            <p>
                <fieldset>
                    <legend>Are you a staff member or student?:</legend>
                    <label for="staff">Staff</label>
                    <input type="radio" id="staff" name="role">
                    <label for="student">Student</label>
                    <input type="radio" id="student" name="role">
                </fieldset>
            </p>
            <p>
                <input type="submit" value="Submit">
            </p>
        </form>
    </body>
</html>
